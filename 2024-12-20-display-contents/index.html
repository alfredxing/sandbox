<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>display: contents rendering</title>
	</head>
	<body style="margin: 0; font-family: ui-sans-serif">
		<div class="notion-topbar-mobile" style="height: 44px">
			<div data-popup-origin="true" style="display: contents" data-display-contents>
				<img
					src="https://emoji.slack-edge.com/T063KNMBD8W/concerned/c1adbaf7f8a0fd14.png"
					style="width: 26px; height: 26px; display: block"
				/>
			</div>
			<div data-popup-origin="true" style="display: contents" data-display-contents>
				<svg viewBox="0 0 26 26" style="width: 26px; height: 26px; display: block">
					<circle cx="13" cy="13" r="10" />
				</svg>
			</div>
			<div data-popup-origin="true" style="display: contents" data-display-contents>
				<img
					src="https://emoji.slack-edge.com/T063KNMBD8W/concerned/c1adbaf7f8a0fd14.png"
					style="width: 26px; height: 26px; display: block; transform: translateZ(0)"
				/>
			</div>
		</div>
		<button id="button">Remove icon</button>
		<script type="text/javascript">
			document.getElementById('button').addEventListener('click', () => {
				document.querySelectorAll('[data-display-contents]').forEach((node) => node.remove());
			});
		</script>
	</body>
</html>
